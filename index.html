<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FirstImmortalStudio</title><style>:root{--bg:#f7f4ee;--ink:#1f1b16;--sub:#5e554a;--line:rgba(31,27,22,.1);--link:#9a3f1c}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--ink:#efe9de;--sub:#aaa398;--line:rgba(239,233,222,.1);--link:#e8916b}}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:0 auto;
padding:48px 24px 64px;line-height:1.6;color:var(--ink);background:var(--bg)}
h1{font-size:28px;font-weight:600;margin:0 0 8px}h2{font-size:20px;font-weight:600;margin:40px 0 12px}
p{margin:0 0 16px}a{color:var(--link);text-underline-offset:3px}li{margin:8px 0}.muted{color:var(--sub);font-size:15px}
.games{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.games li{display:flex;align-items:center;gap:16px;margin:0;padding:16px 0;border-bottom:1px solid var(--line)}
.games img{width:56px;height:56px;border-radius:12px;flex:none}.games strong{display:block;font-weight:600}
.games span{display:block;width:56px;height:56px;flex:none}.games+p{margin-top:24px}</style></head>
